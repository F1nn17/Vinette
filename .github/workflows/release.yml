name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the product version
        run: |
          expected="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' backend/Directory.Build.props)"
          if [ "${GITHUB_REF_NAME#v}" != "$expected" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VersionPrefix ${expected} in backend/Directory.Build.props" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable
      - run: make setup
      - run: make check

  publish:
    name: Publish image and release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write # keyless signing of the image (Sigstore, docs/image-security.md)
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/vinette
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Nothing is pushed before the scan: a CRITICAL finding that has a fix stops the release here.
      - name: Build for the scan (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: vinette:scan
          cache-from: type=gha

      - name: Scan the image for vulnerabilities
        run: sh scripts/scan-image.sh vinette:scan

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is signed and its SBOM attested by digest (every tag points at the same digest). The signature has no key to keep:
      # it is made with the identity of this workflow and recorded in the public Sigstore log. docs/image-security.md shows how to verify it.
      - uses: sigstore/cosign-installer@v4.1.3

      - name: SBOM of the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/vinette@${DIGEST}" >> "$GITHUB_ENV"
          sh scripts/scan-image.sh "ghcr.io/${owner}/vinette@${DIGEST}" "vinette-${GITHUB_REF_NAME#v}.spdx.json"

      - name: Sign the image and attach the SBOM to it
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate "vinette-${GITHUB_REF_NAME#v}.spdx.json" "$IMAGE"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \[" v "\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section [$version] found in CHANGELOG.md" >&2
            exit 1
          fi

      # The archive for a bare-metal install (docs/install-bare-metal.md): the application with the front end, the unit file, the sample config.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the archive for a bare-metal install
        run: |
          corepack enable
          make setup
          make package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "artifacts/vinette-${GITHUB_REF_NAME#v}.tar.gz" \
            "artifacts/vinette-${GITHUB_REF_NAME#v}.tar.gz.sha256" \
            "vinette-${GITHUB_REF_NAME#v}.spdx.json"
