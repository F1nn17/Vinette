name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: make setup
      - run: make check

  integration:
    name: Integration tests (Dovecot in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: make setup
      - run: make test-integration

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: make setup
      - name: Install the browser
        working-directory: frontend
        run: corepack pnpm exec playwright install --with-deps chromium

      - run: make e2e

      # The headers (CSP, HSTS, ...) are sent by the backend, not by the Vite dev server that `make e2e` used: the image is built and the scenarios
      # that need them run against it. The dev mail server that `make e2e` started is still up on this machine, so the container shares its network.
      - name: Build the image
        run: make docker

      - name: Content-Security-Policy against the built image
        working-directory: frontend
        run: |
          # The same flags as the compose file and the Helm chart: read-only root file system, no capabilities, no privilege escalation (docs/image-security.md).
          docker run -d --name vinette-e2e --network host --read-only --cap-drop ALL --security-opt no-new-privileges:true -v vinette-e2e-data:/data \
            -e VINETTE_Imap__Host=localhost -e VINETTE_Imap__Port=3993 -e VINETTE_Imap__Security=Tls -e VINETTE_Imap__AllowInvalidCertificate=true \
            -e VINETTE_Smtp__Host=localhost -e VINETTE_Smtp__Port=3587 -e VINETTE_Smtp__Security=StartTls -e VINETTE_Smtp__AllowInvalidCertificate=true \
            -e VINETTE_Security__LoginRateLimit__MaxFailuresPerIp=1000 -e VINETTE_Security__LoginRateLimit__MaxAttemptsPerMinutePerIp=1000 \
            vinette:dev
          for i in $(seq 1 30); do curl -fs http://localhost:8080/api/v1/health && break; sleep 2; done
          VINETTE_E2E_URL=http://localhost:8080 corepack pnpm exec playwright test csp

      - name: Show the log of the image when something failed
        if: failure()
        run: docker logs vinette-e2e || true

      - name: Keep the report when a scenario fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for the scan (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: vinette:scan
          cache-from: type=gha

      # A CRITICAL finding that has a fix fails the build; HIGH ones are listed (docs/image-security.md).
      - name: Scan the image for vulnerabilities
        run: sh scripts/scan-image.sh vinette:scan

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
