name: Сообщение об ошибке
description: Что-то работает не так, как ожидалось
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Об уязвимостях не сообщайте здесь — см. [SECURITY.md](https://github.com/F1nn17/vinette/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: Что вы ожидали и что получили.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Vinette
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Как запущено
      options: [Docker, systemd, Из исходников]
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: Уберите пароли и адреса, которые не хотите раскрывать.
      render: text
