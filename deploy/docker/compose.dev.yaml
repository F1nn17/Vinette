# Development environment: a test mail server with pre-created mailboxes.
#   docker compose -f deploy/docker/compose.dev.yaml up -d
# Mailboxes. GreenMail login is the part before "@" (NOT the full address):
#   login alice / password alice-pass  (alice@vinette.test)
#   login bob   / password bob-pass    (bob@vinette.test)
# Run Vinette itself with `make dev` and point it at localhost (see backend appsettings.Development.json).
services:
  greenmail:
    image: greenmail/standalone:2.1.8
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=alice:alice-pass@vinette.test,bob:bob-pass@vinette.test
        -Dgreenmail.auth.disabled=false
        -Dgreenmail.verbose
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP
      - "3465:3465"   # SMTPS
      - "3993:3993"   # IMAPS
      - "8081:8080"   # GreenMail API
