apiVersion: v1
kind: Pod
metadata:
  name: {{ include "vinette.fullname" . }}-test
  labels:
    {{- include "vinette.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: {{ dig "image" "docker.io/curlimages/curl:8.11.1" (.Values.test | default dict) | quote }}
      args: ["--fail", "--silent", "--show-error", "--max-time", "10", "http://{{ include "vinette.fullname" . }}:{{ .Values.service.port }}/api/v1/health"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
