{{- if .Values.secret.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vinette.fullname" . }}
  labels:
    {{- include "vinette.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.values }}
  VINETTE_{{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
